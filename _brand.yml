# ──────────────────────────────────────────────────────────────
# Brand Identity
# ──────────────────────────────────────────────────────────────
# This is the SINGLE source of truth for all brand styling.
# Quarto auto-discovers this file; the agent maps the same
# values into Slidev themes. Edit once, applied everywhere.
#
# Spec: https://posit-dev.github.io/brand-yml
# ──────────────────────────────────────────────────────────────

meta:
  name: "OfficeKit"               # Your brand or organization name
  link: ""                        # Website URL

logo:
  small:
    light: assets/logo.svg        # Logo for light backgrounds
    dark: assets/logo-light.svg   # Logo for dark backgrounds
  medium:
    light: assets/logo.svg        # Logo for light backgrounds
    dark: assets/logo-light.svg   # Logo for dark backgrounds

color:
  palette:
    white: "#FFFFFF"
    black: "#111827"
    slate: "#64748B"
    violet: "#7C3AED"
    indigo: "#4338CA"
    lavender: "#C4B5FD"
  foreground: black
  background: white
  primary: violet
  secondary: indigo

typography:
  fonts:
    - family: Inter
      source: google
      weight: [300, 400, 500, 600, 700]
      style: [normal, italic]
    - family: JetBrains Mono
      source: google
      weight: [400, 500, 700]

  base:
    family: Inter
    size: 1rem
    weight: 400
    line-height: 1.6

  headings:
    family: Inter
    weight: 600
    line-height: 1.25

  monospace:
    family: JetBrains Mono
    size: 0.875em
