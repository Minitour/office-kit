[project]
name = "office-kit"
version = "0.1.0"
description = "Shared tooling for OfficeKit documents, presentations, and videos"
requires-python = ">=3.10,<3.13"
dependencies = [
  "kokoro>=0.9.4,<0.10",
  "soundfile>=0.12,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
