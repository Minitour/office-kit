skills:
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: Guide for managing capabilities with capa CLI
  - id: slidev
    type: github
    def:
      repo: marcoshaber99/slidev-skills@slidev
      description: Best practices for Slidev — presentation slides for developers
  - id: brand-yml
    type: github
    def:
      repo: posit-dev/skills@brand-yml
      description: >-
        Create and use brand.yml files for consistent branding across Quarto
        documents
  - id: quarto-authoring
    type: github
    def:
      repo: posit-dev/skills@quarto-authoring
      description: >-
        Quarto document authoring best practices — syntax, cross-references,
        callouts, YAML config, extensions, and R Markdown migration
  - id: officekit-documents
    type: local
    def:
      path: skills/officekit-documents
      description: >-
        OfficeKit-specific document conventions — template scaffolding,
        _brand.yml integration for Word reference docs, config.toml usage, and
        project structure
  - id: create-docs
    type: local
    def:
      path: skills/create-docs
      description: >-
        The /create-docs command — slim entry point for the OfficeKit document
        authoring workflow (concept → outline → plan → scaffold → author →
        render) for reports, proposals, memos, and articles
  - id: create-slides
    type: local
    def:
      path: skills/create-slides
      description: >-
        The /create-slides command — slim entry point for the OfficeKit
        presentation authoring workflow (concept → outline → plan → scaffold →
        author → export) for pitch decks, lectures, and talks
  - id: logo-creator
    type: github
    def:
      repo: resciencelab/opc-skills@logo-creator
  - id: create-readme
    type: github
    def:
      repo: github/awesome-copilot@create-readme
  - id: svg-logo-designer
    type: github
    def:
      repo: rknall/claude-skills@svg-logo-designer
  - id: skill-creator
    type: github
    def:
      repo: anthropics/skills@skill-creator
servers: []
tools: []
plugins: []
options:
  toolExposure: none
  requiresCommands:
    - cli: quarto
      description: >-
        Quarto is a scientific and technical publishing system. Install from
        https://quarto.org/docs/get-started/
    - cli: node
      description: >-
        Node.js is required for Slidev presentations. Install from
        https://nodejs.org/en/download/
    - cli: npm
      description: npm is the Node.js package manager, bundled with Node.js.
agents:
  base:
    type: local
    path: ./WORKFLOW.md
  additional:
    - type: inline
      id: capa_tool_usage
      content: >-
        After learning a new skill, call the `setup_tools` tool to activate it,
        then use `call_tool` to invoke the relevant tool.
subagents: []
rules: []
hooks: []
