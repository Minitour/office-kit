[project]
name = "office-kit"
version = "0.2.0"
description = "Shared tooling for OfficeKit documents, presentations, and videos"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jinja2>=3.1,<4",
  "kokoro>=0.9.4,<0.10",
  "pyyaml>=6,<7",
  "soundfile>=0.12,<1",
  "tomli>=2.0.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
