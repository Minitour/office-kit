# ──────────────────────────────────────────────────────────────
# OfficeKit — capa capabilities
#
# Pipelines: standalone HTML documents, Slidev decks, HyperFrames
# video with offline narration.
#
# Brand contract: each identity lives under brands/<id>/. That
# directory's brand.json is canonical. BRAND.md, tokens.css, and
# frame.md are generated from it by scripts/brand/generate.py and are
# never independent sources. Supplied assets are preserved
# byte-for-byte under brands/<id>/assets/. config.toml [brand] default
# names the fallback identity.
#
# Operational defaults live in config.toml. Orchestration contract and
# durable project state: WORKFLOW.md.
# ──────────────────────────────────────────────────────────────

skills:
  # ── Meta ───────────────────────────────────────────────────
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: >-
        Manage this project's capa configuration — capabilities.yaml, skills,
        sub-agents, options, and the install loop

  # ── OfficeKit workflow entry points (local) ────────────────
  - id: init-brand
    type: local
    def:
      path: skills/init-brand
      description: >-
        The /init-brand command — create, migrate, or revise a brand
        identity under `brands/<id>/`: the canonical `brand.json` plus its
        generated derivatives `BRAND.md`, `tokens.css`, and `frame.md`,
        with supplied assets preserved under `assets/`
  - id: create-doc
    type: local
    def:
      path: skills/create-doc
      description: >-
        The /create-doc command — write a brand-styled, self-contained HTML
        document in one pass (scaffold → author → verify) for reports,
        proposals, memos, briefs, articles, letters, and whitepapers. One file,
        opened straight from disk; no subagents and no preview server
  - id: create-slides
    type: local
    def:
      path: skills/create-slides
      description: >-
        The /create-slides command — write a Slidev deck in primary context
        (plan → preview → author → review) for pitches, lectures, and talks.
        Loads slidev, slidev-layouts, and slidev-themes. No authoring
        subagent; research-agent only when claims need checking
  - id: create-video
    type: local
    def:
      path: skills/create-video
      description: >-
        The /create-video command — write a HyperFrames video in primary
        context (plan → scenes → narration → review) with per-segment offline
        narration. No authoring subagent; research-agent only when claims need
        checking
  - id: text-to-speech
    type: local
    def:
      path: skills/text-to-speech
      description: >-
        Synthesize offline narration locally with Kokoro — one WAV clip per
        approved script segment — and build measured timing manifests for video
        or slide composition

  # ── Engines ────────────────────────────────────────────────
  - id: html
    type: github
    def:
      repo: plannotator/effective-html@html
      description: >-
        Effective HTML — semantic, accessible, responsive HTML and CSS
        authoring. Reference for unusual markup or for changing the shared
        document template; the standard document pass does not need it, because
        the template already carries the layout, accessibility, and print rules
  - id: slidev
    type: github
    def:
      repo: marcoshaber99/slidev-skills@slidev
      description: >-
        Slidev — markdown-driven presentation slides: syntax, frontmatter,
        animations, code highlighting, assets, and export. Load with
        slidev-layouts and slidev-themes when authoring a deck
  - id: hyperframes
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes
      description: >-
        HyperFrames router — entry point that routes to the core, CLI,
        animation, creative, and keyframes skills
  - id: hyperframes-core
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes-core
      description: HyperFrames core — scene model, composition, and rendering
  - id: hyperframes-cli
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes-cli
      description: >-
        HyperFrames CLI — project setup, preview, audio normalization, and
        render commands
  - id: hyperframes-animation
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes-animation
      description: HyperFrames animation — motion primitives, easing, and timing
  - id: hyperframes-creative
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes-creative
      description: >-
        HyperFrames creative direction — storyboarding, visual language, and
        pacing
  - id: hyperframes-keyframes
    type: github
    def:
      repo: heygen-com/hyperframes@hyperframes-keyframes
      description: HyperFrames keyframes — keyframe authoring and timeline control
  - id: slidev-layouts
    type: github
    def:
      repo: yoanbernabeu/slidev-skills@slidev-layouts
      description: >-
        Slidev layouts — pick a built-in layout per slide (cover, intro,
        section, two-cols, fact, quote, image-right, end, and the rest) or
        write a custom layout. Required whenever create-slides authors a deck
  - id: slidev-themes
    type: github
    def:
      repo: yoanbernabeu/slidev-skills@slidev-themes
      description: >-
        Slidev themes — apply theme, colorSchema, and themeConfig. Required
        whenever create-slides authors a deck; OfficeKit keeps the config.toml
        theme and brands/<id>/tokens.css, and does not install a new theme to
        restyle a deck

servers: []
tools: []
plugins: []

options:
  toolExposure: on-demand
  agentActivity: true
  requiresCommands:
    - cli: node
      description: >-
        Node.js 22 LTS or newer, required by Slidev and the HyperFrames
        renderer. Verify with `node -v`; if it reports below v22, install with
        `nvm install 22 && nvm use 22` or download from
        https://nodejs.org/en/download/
    - cli: npm
      description: >-
        npm ships with Node.js and manages the shared workspace `node_modules`
        at the repo root. Always install from the workspace root (`npm install
        -w projects/<slug> <pkg>`), never from inside a project
    - cli: uv
      description: >-
        uv runs the Python tooling — offline Kokoro narration and the narration
        manifest utility in skills/text-to-speech/scripts. Install from
        https://docs.astral.sh/uv/getting-started/installation/
    - cli: ffmpeg
      description: >-
        ffmpeg muxes narration with rendered frames and encodes final video
        deliverables. Install with `brew install ffmpeg`

agents:
  base:
    type: local
    path: ./WORKFLOW.md

subagents:
  - id: brand-agent
    description: >-
      Brand system specialist. Use when creating, migrating, or revising a
      named identity under `brands/<id>/` — that directory's `brand.json`,
      its generated derivatives, and brand assets — or when generated brand
      files are stale relative to the canonical file.
    skills:
      - init-brand
    tools: []
    instructions: |
      You are the brand-agent. You are the only owner of the brand catalog.

      **The contract:** each identity is `brands/<id>/`. That directory's
      `brand.json` is the canonical, machine-readable source of truth.
      `BRAND.md` (human-readable usage), `tokens.css` (CSS custom properties
      for standalone HTML and Slidev), and `frame.md` (HyperFrames
      frame/camera spec) are **generated** from it and must never become
      independent sources. Never hand-edit a generated file — change
      `brands/<id>/brand.json` and regenerate. A second company, client, or
      product look is a new `brands/<id>/`, not an overwrite.

      **Files you may write — nothing else:**
      - `brands/<id>/brand.json`.
      - The generated derivatives `brands/<id>/BRAND.md`,
        `brands/<id>/tokens.css`, and `brands/<id>/frame.md`, produced only
        by running the generator.
      - Brand assets you generate yourself, and copies of supplied assets,
        under `brands/<id>/assets/`.
      - The `[brand]` table in `config.toml` (`default` only) when the
        fallback identity changes.
      - `projects/<slug>/reports/build.md` for your stage record.

      **Approval gate:** present the proposed brand identity (including the
      id) and wait for the user's explicit approval before writing any
      canonical or generated brand file. Brand-only initialization does not
      require a project or `PLAN.md`. When the change belongs to a
      deliverable project, record the new identity in that project's plan if
      one exists; do not wait for a second plan approval. Run
      `uv run python scripts/brand/generate.py <id>` only after the brand
      approval.
      The generator validates `brand.json` and rewrites all three derivatives
      deterministically; it never touches `brand.json` or `assets/`.
      Report its validation errors verbatim instead of working around them. A
      revision to an established brand changes every existing deliverable
      that uses that id — never make one silently.

      **Preserve originals:** supplied logos, fonts, images, and data are
      preserved byte-for-byte under `brands/<id>/assets/`. Never edit,
      overwrite, rename, or re-encode an original. Derived variants are
      written as new files alongside, and provenance is recorded separately.

      **You must not** edit operational keys in `config.toml`, `PLAN.md`,
      another stage's report, or any Slidev or HyperFrames source, and never
      hand-edit a document.

      **Propagating a revision.** Decks read `brands/<id>/tokens.css` live,
      so they need nothing beyond a `style.css` path that names the id. Two
      consumers hold generated copies instead:
      - Standalone documents embed the token sheet and the marks so they open
        as one file. After regenerating, run
        `uv run python scripts/document/doc.py refresh --all`, which rewrites
        only the script-owned brand region of each document under
        `projects/`, using the brand id recorded in that file. That command
        is the single exception to "never edit a document".
      - HyperFrames projects require a project-local snapshot because their
        server rejects parent traversal; refresh that snapshot from
        `brands/<id>/` into the project's `brand/` directory and never
        hand-edit it.

      Never duplicate brand values into `config.toml`. The `[brand] default`
      key is an id, not a color.

      **Durable handoff (never chat-only):** the canonical and generated brand
      files record the resolved palette, typography, logo paths, CSS custom
      property names, and asset provenance. When a project is in scope, record
      the generator run in `projects/<slug>/reports/build.md`. The primary
      agent updates `PLAN.md` when a project is in scope. Return a concise
      status for relay.

  - id: research-agent
    description: >-
      Source gathering and fact checking. The only production subagent. Use
      when a deliverable needs external research, visual or competitive
      context, accessibility evidence, data, or citations. The caller authors
      the deliverable after you return.
    skills: []
    tools: []
    instructions: |
      You are the research-agent. You gather and verify source material. You do
      not outline, write, style, or export the deliverable, and you need no
      engine skill to do your job.

      **Files you may create or edit — nothing else:**
      - `projects/<slug>/reports/research.md`

      **Procedure:**
      1. Read `projects/<slug>/plan/PLAN.md` for scope when it exists. For a
         document there is no plan: work from the questions you were handed and
         `projects/<slug>/NOTES.md` if it is there.
      2. Structure `research.md` as one section per question asked, followed by
         a Sources section recording every source with title, URL or file path,
         and date accessed.
      3. Mark each claim `verified`, `single-source`, or `unverified`. Never
         present an unverified claim as fact and never invent a citation.
      4. Close with an "Open gaps" section so the caller can convert them into
         open questions or hedged wording.

      **You must not** touch `PLAN.md`, `NOTES.md`, any deliverable source, any
      file under `brands/`, `config.toml`, or another stage's report.
      User-supplied data files are read-only inputs — quote from them, never
      edit them.

      **Stay proportionate.** You are opt-in, not a default stage. Answer the
      questions you were given and stop; do not expand scope into a survey.

      **Durable handoff:** `reports/research.md` is the artifact. Return a
      concise status for relay.

rules: []
hooks: []
